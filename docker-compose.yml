version: "3.9"

services:
  fitness-booking:
    build:
      context: .
      dockerfile: Dockerfile
    image: fitness-booking-service:local
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      HTTP_PORT: "8080"
      GRPC_PORT: "9090"
      SHUTDOWN_TIMEOUT_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - fitness-postgres-data:/var/lib/postgresql/data

volumes:
  fitness-postgres-data:
